<section class="create-product">
  <div class="page-header">
    <div>
      <p class="eyebrow">Inventory</p>
      <h1>Create Product</h1>
    </div>
    <a routerLink="/admin/products" class="secondary-link">Back to Products</a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="product-form">
    <div class="form-grid">
      <label>
        <span>Product name</span>
        <input formControlName="productName" type="text" placeholder="Enter product name" />
      </label>

      <label>
        <span>Price</span>
        <input formControlName="price" type="number" min="0" step="0.01" />
      </label>

      <label>
        <span>Stock quantity</span>
        <input formControlName="stockQuantity" type="number" min="0" step="1" />
      </label>

      <label>
        <span>SKU</span>
        <input formControlName="sku" type="text" placeholder="SKU-001" />
      </label>

      <label>
        <span>Brand</span>
        <input formControlName="brand" type="text" placeholder="Brand" />
      </label>

      <label>
        <span>Category Name</span>
        <select formControlName="categoryName">
          <option value="">Select a category</option>
          @for (category of categories(); track category.categoryId ?? category.categoryName) {
            <option [value]="category.categoryName">{{ category.categoryName }}</option>
          }
        </select>
      </label>

      <label class="full-width">
        <span>Image URL(s)</span>
        <input formControlName="imageUrls" type="text" placeholder="https://example.com/1.jpg, https://example.com/2.jpg" />
      </label>

      <label class="full-width">
        <span>Description</span>
        <textarea formControlName="description" rows="4" placeholder="Product description"></textarea>
      </label>
    </div>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <div class="actions">
      <button type="button" class="secondary-button" routerLink="/admin/products">Cancel</button>
      <button type="submit" class="primary-button">Create Product</button>
    </div>
  </form>
</section>
