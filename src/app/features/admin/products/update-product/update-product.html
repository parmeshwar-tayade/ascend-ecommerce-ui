<section class="update-product">

  <div class="page-header">
    <div>
      <h1>Update Product</h1>
    </div>

    <button
      mat-stroked-button
      color="primary"
      routerLink="/admin/products">
      Back To Products
    </button>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()">

    <div class="form-grid">

      <!-- Product Name -->
      <mat-form-field appearance="outline">
        <mat-label>Product Name</mat-label>
        <input
          matInput
          formControlName="productName">
      </mat-form-field>

      <!-- Price -->
      <mat-form-field appearance="outline">
        <mat-label>Price</mat-label>
        <input
          matInput
          type="number"
          formControlName="price">
      </mat-form-field>

      <!-- Discount Price -->
      <mat-form-field appearance="outline">
        <mat-label>Discount Price</mat-label>
        <input
          matInput
          type="number"
          formControlName="discountPrice">
      </mat-form-field>

      <!-- Stock Quantity -->
      <mat-form-field appearance="outline">
        <mat-label>Stock Quantity</mat-label>
        <input
          matInput
          type="number"
          formControlName="stockQuantity">
      </mat-form-field>

      <!-- SKU -->
      <mat-form-field appearance="outline">
        <mat-label>SKU</mat-label>
        <input
          matInput
          formControlName="sku">
      </mat-form-field>

      <!-- Brand -->
      <mat-form-field appearance="outline">
        <mat-label>Brand</mat-label>
        <input
          matInput
          formControlName="brand">
      </mat-form-field>

      <!-- Category -->
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>

        <mat-select formControlName="categoryName">

          @for(category of categories(); track category.categoryId){

            <mat-option
              [value]="category.categoryName">
              {{ category.categoryName }}
            </mat-option>

          }

        </mat-select>
      </mat-form-field>

      <!-- Status -->
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>

        <mat-select formControlName="status">

          <mat-option value="ACTIVE">
            ACTIVE
          </mat-option>

          <mat-option value="INACTIVE">
            INACTIVE
          </mat-option>

          <mat-option value="OUT_OF_STOCK">
            OUT OF STOCK
          </mat-option>

        </mat-select>
      </mat-form-field>

<!-- Image URLs -->
<mat-form-field appearance="outline" class="full-width">
  <mat-label>Image URLs</mat-label>

  <input
    matInput
    formControlName="imageUrls"
    placeholder="/assets/images/img1.jpg, /assets/images/img2.jpg">
</mat-form-field>

<div class="image-upload-section">

  <input
    #fileInput
    type="file"
    multiple
    accept="image/*"
    hidden
    (change)="onImagesSelected($event)">

  <button
    mat-stroked-button
    type="button"
    (click)="fileInput.click()">

    Select Images

  </button>

</div>
<!-- Description -->
      <mat-form-field
        appearance="outline"
        class="full-width">

        <mat-label>Description</mat-label>

        <textarea
          matInput
          rows="5"
          formControlName="description">
        </textarea>

      </mat-form-field>

      <!-- Featured -->
      <div class="toggle-wrapper">

        <mat-slide-toggle
          color="primary"
          formControlName="isFeatured">

          Featured Product

        </mat-slide-toggle>

      </div>

      <!-- Available -->
      <div class="toggle-wrapper">

        <mat-slide-toggle
          color="accent"
          formControlName="available">

          Available

        </mat-slide-toggle>

      </div>

    </div>

    @if(errorMessage){

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }

    <div class="actions">

      <button
        mat-stroked-button
        type="button"
        routerLink="/admin/products">

        Cancel

      </button>

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Update Product

      </button>

    </div>

  </form>

</section>
