<section class="management-page">
  <mat-card>
    <mat-card-header class="page-header">
      <div class="page-header__title">
        <p class="eyebrow">Admin</p>
        <h1>Category Management</h1>
      </div>
      <button mat-flat-button color="primary" [routerLink]="['/admin/categories/create']">
        Create Category
      </button>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <div class="status-box status-box--loading">
          <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
          <span>Loading categories...</span>
        </div>
      } @else if (errorMessage()) {
        <div class="status-box status-box--error">{{ errorMessage() }}</div>
      } @else {
        <div class="table-wrap">
          <table mat-table [dataSource]="categories()" class="mat-elevation-z0">
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>ID</th>
              <td mat-cell *matCellDef="let category">{{ category.categoryId ?? category.categoryId ?? '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let category">{{ category.categoryName }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let category">{{ category.description || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let category">
                <button mat-flat-button color="warn" type="button" (click)="deleteCategory(category.categoryId)">Delete</button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      }
    </mat-card-content>
  </mat-card>
</section>
